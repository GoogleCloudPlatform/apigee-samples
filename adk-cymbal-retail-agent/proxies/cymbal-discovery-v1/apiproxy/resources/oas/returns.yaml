openapi: 3.0.0
info:
  title: Returns API
  description: >-
    This API manages returns. It provides endpoints for creating a return 
    request, retrieving details of a specific return, and 
    processing a refund or credit.
  version: 2.0.0
  contact:
    name: Cymbal Retail
    url: https://cymbal-retail.com
servers:
  - url: https://APIGEE_HOST
security:
  - OidcAuth:
      - manager
paths:
  /v2/samples/adk-cymbal-retail/returns:
    get:
      summary: Get a list of all return requests
      operationId: getAllReturns
      tags:
        - returns
      responses:
        '200':
          description: A list of return requests.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReturnRequest'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Create a new return request
      operationId: createReturnRequest
      tags:
        - returns
      requestBody:
        description: Details for the new return request.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewReturnRequest'
      responses:
        '201':
          description: Return request created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReturnRequest'
        '400':
          description: Invalid input.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v2/samples/adk-cymbal-retail/returns/{returnId}:
    get:
      summary: Get a return request by ID
      operationId: getReturnById
      tags:
        - returns
      parameters:
        - name: returnId
          in: path
          description: ID of the return request to retrieve.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Return request found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReturnRequest'
        '404':
          description: Return request not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: Update an existing return request
      operationId: updateReturnStatus
      tags:
        - returns
      parameters:
        - name: returnId
          in: path
          description: ID of the return request to update.
          required: true
          schema:
            type: string
      requestBody:
        description: Updated return request details.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReturnRequest'
      responses:
        '200':
          description: Return request updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReturnRequest'
        '400':
          description: Invalid input.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Return request not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v2/samples/adk-cymbal-retail/returns/{returnId}/process-refund:
    post:
      summary: Process refund for a return
      operationId: processRefund
      tags:
        - returns
      parameters:
        - name: returnId
          in: path
          description: ID of the return to process refund for.
          required: true
          schema:
            type: string
      requestBody:
        description: Refund amount and details.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcessRefundRequest'
      responses:
        '200':
          description: Refund processed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessRefundResponse'
        '400':
          description: Invalid input.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Return request not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    ReturnRequest:
      type: object
      properties:
        returnId:
          type: string
          description: Unique identifier for the return request.
        orderId:
          type: string
          description: ID of the order associated with the return.
        customerId:
          type: string
          description: ID of the customer making the return.
        returnDate:
          type: string
          format: date-time
          description: Date and time when the return request was created.
        status:
          type: string
          description: Current status of the return request.
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReturnItem'
        refundAmount:
          type: number
          format: float
          description: Total amount to be refunded.
    NewReturnRequest:
      type: object
      required:
        - orderId
      properties:
        orderId:
          type: string
          description: ID of the order associated with the return.
        reason:
          type: string
          description: Reason for returning the items.
        items:
          type: array
          items:
            $ref: '#/components/schemas/NewReturnItem'
    ReturnItem:
      type: object
      properties:
        itemId:
          type: string
          description: Unique identifier for the item.
        quantity:
          type: integer
          description: Quantity of the item being returned.
        reason:
          type: string
          description: Reason for returning the item.
    NewReturnItem:
      type: object
      required:
        - itemId
        - quantity
      properties:
        itemId:
          type: string
          description: Unique identifier for the item.
        quantity:
          type: integer
          description: Quantity of the item being returned.
        reason:
          type: string
          description: Reason for returning the item.
    ProcessRefundRequest:
      type: object
      required:
        - amount
      properties:
        amount:
          type: number
          format: float
          description: Refund amount.
    ProcessRefundResponse:
      type: object
      properties:
        refundId:
          type: string
          description: Unique identifier for the processed refund.
        status:
          type: string
          description: Status of the refund.
        amount:
          type: number
          format: float
          description: Refunded amount.
    Error:
      type: object
      properties:
        code:
          type: integer
          description: Error code.
        message:
          type: string
          description: Error message.
