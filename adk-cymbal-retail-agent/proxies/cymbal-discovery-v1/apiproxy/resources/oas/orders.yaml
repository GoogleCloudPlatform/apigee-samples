openapi: 3.0.0
info:
  title: Orders API
  description: >-
    This API manages orders, allowing for creation, retrieval, and 
    update of orders.
  version: 2.0.0
  contact:
    name: Cymbal Retail
    url: https://cymbal-retail.com
servers:
  - url: https://APIGEE_HOST
security:
  - OidcAuth:
      - customer
paths:
  /v2/samples/adk-cymbal-retail/orders:
    get:
      summary: Get a list of all orders
      operationId: getAllOrders
      tags:
        - orders
      responses:
        '200':
          description: A list of orders.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Create a new order
      operationId: createOrder
      tags:
        - orders
      requestBody:
        description: Order details to create.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewOrder'
      responses:
        '201':
          description: Order created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Invalid input.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v2/samples/adk-cymbal-retail/orders/{orderId}:
    get:
      summary: Get an order by ID
      operationId: getOrderById
      tags:
        - orders
      parameters:
        - name: orderId
          in: path
          description: ID of the order to retrieve.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Order found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          description: Order not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: Update an existing order
      operationId: updateOrder
      tags:
        - orders
      parameters:
        - name: orderId
          in: path
          description: ID of the order to update.
          required: true
          schema:
            type: string
      requestBody:
        description: Updated order details.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Order'
      responses:
        '200':
          description: Order updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Invalid input.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Order not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    Order:
      type: object
      properties:
        orderId:
          type: string
          description: Unique identifier for the order.
        customerId:
          type: string
          description: ID of the customer who placed the order.
        orderDate:
          type: string
          format: date-time
          description: Date and time when the order was placed.
        status:
          type: string
          description: Current status of the order.
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        totalAmount:
          type: number
          format: float
          description: Total amount of the order.
    NewOrder:
      type: object
      required:
        - customerId
        - items
      properties:
        customerId:
          type: string
          description: ID of the customer placing the order.
        items:
          type: array
          items:
            $ref: '#/components/schemas/NewOrderItem'
    OrderItem:
      type: object
      properties:
        itemId:
          type: string
          description: Unique identifier for the item.
        quantity:
          type: integer
          description: Quantity of the item ordered.
        price:
          type: number
          format: float
          description: Price per unit of the item.
    NewOrderItem:
      type: object
      required:
        - itemId
        - quantity
      properties:
        itemId:
          type: string
          description: Unique identifier for the item.
        quantity:
          type: integer
          description: Quantity of the item ordered.
    Error:
      type: object
      properties:
        code:
          type: integer
          description: Error code.
        message:
          type: string
          description: Error message.
  securitySchemes:
    OidcAuth:
      type: openIdConnect
      description: OpenID Connect authorization.
      openIdConnectUrl: https://APIGEE_HOST/.well-known/openid-configuration