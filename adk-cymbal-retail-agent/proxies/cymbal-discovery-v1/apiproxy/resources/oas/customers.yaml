openapi: 3.0.0
info:
  title: Customer Profile API
  description: >-
    This API manages customer profiles and contains operations to retrieve all customer 
    profiles, get a specific customer's profile by ID, create a new 
    customer profile, and update an existing customer profile.
  version: 2.0.0
  contact:
    name: Cymbal Retail
    url: https://cymbal-retail.com
servers:
  - url: https://APIGEE_HOST
security:
  - OidcAuth:
      - manager
paths:
  /v2/samples/adk-cymbal-retail/customers:
    get:
      summary: Get a list of all customers
      operationId: getAllCustomers
      tags:
        - customers
      responses:
        '200':
          description: A list of customer profiles.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CustomerProfile'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Create a new customer profile
      operationId: createCustomer
      tags:
        - customers
      requestBody:
        description: Customer profile to create.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewCustomerProfile'
      responses:
        '201':
          description: Customer profile created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerProfile'
        '400':
          description: Invalid input.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v2/samples/adk-cymbal-retail/customers/{customerId}:
    get:
      summary: Get a customer by ID
      operationId: getCustomerById
      tags:
        - customers
      parameters:
        - name: customerId
          in: path
          description: ID of the customer to retrieve.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Customer profile found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerProfile'
        '404':
          description: Customer not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: Update an existing customer profile
      operationId: updateCustomer
      tags:
        - customers
      parameters:
        - name: customerId
          in: path
          description: ID of the customer to update.
          required: true
          schema:
            type: string
      requestBody:
        description: Updated customer profile.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerProfile'
      responses:
        '200':
          description: Customer profile updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerProfile'
        '400':
          description: Invalid input.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Customer not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    CustomerProfile:
      type: object
      properties:
        customerId:
          type: string
          description: Unique identifier for the customer.
        name:
          type: string
          description: Full name of the customer.
        email:
          type: string
          format: email
          description: Email address of the customer.
        phoneNumber:
          type: string
          description: Contact phone number of the customer.
        address:
          type: string
          description: Primary address of the customer.
        creationDate:
          type: string
          format: date-time
          description: Date and time when the customer profile was created.
        lastUpdatedDate:
          type: string
          format: date-time
          description: Date and time when the customer profile was last updated.
    NewCustomerProfile:
      type: object
      required:
        - name
        - email
      properties:
        name:
          type: string
          description: Full name of the customer.
        email:
          type: string
          format: email
          description: Email address of the customer.
        phoneNumber:
          type: string
          description: Contact phone number of the customer.
        address:
          type: string
          description: Primary address of the customer.
    Error:
      type: object
      properties:
        code:
          type: integer
          description: Error code.
        message:
          type: string
          description: Error message.
  securitySchemes:
    OidcAuth:
      type: openIdConnect
      description: OpenID Connect authorization.
      openIdConnectUrl: https://APIGEE_HOST/.well-known/openid-configuration