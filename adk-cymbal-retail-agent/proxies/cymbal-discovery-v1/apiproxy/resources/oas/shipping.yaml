openapi: 3.0.0
info:
  title: Shipping and Label API
  description: API to calculate rates and create shipping labels for Cymbal Retail.
  version: 2.0.0
servers:
  - url: https://APIGEE_HOST
security:
  - OidcAuth:
      - manager
paths:
  /v2/samples/adk-cymbal-retail/shipping:
    post:
      summary: Create a shipping label and get rates
      operationId: createShippingLabel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                shippingLabelRequest:
                  type: object
                  properties:
                    recipientName:
                      type: string
                    address:
                      type: string
                    weight:
                      type: number
      responses:
        '200':
          description: Shipping label response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  shippingLabelResponse:
                    type: object
                    properties:
                      confirmationId:
                        type: string
                      shippingLabelStatus:
                        type: string
