AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Apigee API hub AWS API Gateway plugin: real-time sync Lambda +
  EventBridge rule. Deploy one stack per AWS region.

Parameters:
  ApihubHost:
    Type: String
    Default: https://apihub.googleapis.com
    Description: API hub base URL (e.g., https://apihub.googleapis.com)
  GcpProject:
    Type: String
    Description: GCP project ID hosting the API hub plugin instance (e.g., <project-id>)
  GcpLocation:
    Type: String
    Default: us-west1
    Description: Location hosting API hub instance (e.g., us-west1)
  PluginId:
    Type: String
    Default: system-aws-apigateway
    Description: API hub plugin ID for AWS API Gateway plugin.
  PluginInstanceId:
    Type: String
    Description: API hub plugin instance ID (auto-generated on instance creation, e.g., <plugin-instance-id>)
  WifAudience:
    Type: String
    Description: >
      Full WIF audience string, e.g.,
      //iam.googleapis.com/projects/<project-number>/locations/global/workloadIdentityPools/<pool-id>/providers/<provider-id>
  WifSaEmail:
    Type: String
    Description: >
      GCP service account email, e.g.,
      aws-realtime-lambda@<project-id>.iam.gserviceaccount.com
  ActionId:
    Type: String
    Default: sync-metadata
    Description: Plugin action ID recorded on collect requests

Resources:
  # Execution role for the Lambda. Name includes AWS region so
  # multi-region deploys don't collide (IAM roles are account-global)
  # AND so GCP can pre-create a role-scoped WIF binding with a
  # predictable name.
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "aws-onramp-realtime-${AWS::Region}-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ApiGatewayReadOnly
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: apigateway:GET
                Resource: "arn:aws:apigateway:*::/*"

  # Lambda function. Name is auto-generated by CloudFormation.
  # CloudWatch will auto-create the log group with the function's name.
  RealtimeFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: nodejs24.x
      Handler: index.handler
      Role: !GetAtt ExecutionRole.Arn
      Timeout: 60
      MemorySize: 512
      Code:
        # Placeholder that logs the event so a bare invoke works
        # before the real code is uploaded. Replaced entirely in
        # Phase 3 by pasting index.mjs into the Lambda Console.
        ZipFile: |
          export const handler = async (event) => {
            console.log("placeholder handler, upload real code");
            console.log(JSON.stringify(event));
            return { placeholder: true };
          };
      Environment:
        Variables:
          APIHUB_HOST: !Ref ApihubHost
          PROJECT: !Ref GcpProject
          LOCATION: !Ref GcpLocation
          PLUGIN_ID: !Ref PluginId
          PLUGIN_INSTANCE_ID: !Ref PluginInstanceId
          WIF_AUDIENCE: !Ref WifAudience
          WIF_SA_EMAIL: !Ref WifSaEmail
          ACTION_ID: !Ref ActionId
          DETAIL_CONCURRENCY: "5"

  # EventBridge rule matching the 12 API Gateway control-plane events
  # the Lambda handles. Name is auto-generated per stack.
  ApiGatewayEventsRule:
    Type: AWS::Events::Rule
    Properties:
      EventPattern:
        source: [aws.apigateway]
        detail-type: ["AWS API Call via CloudTrail"]
        detail:
          eventSource: [apigateway.amazonaws.com, apigatewayv2.amazonaws.com]
          eventName:
            - DeleteRestApi
            - DeleteApi
            - ImportRestApi
            - PutRestApi
            - ImportApi
            - ReimportApi
            - CreateStage
            - UpdateStage
            - DeleteStage
            - CreateDeployment
            - UpdateApi
            - UpdateRestApi
      State: ENABLED
      Targets:
        - Id: RealtimeLambda
          Arn: !GetAtt RealtimeFunction.Arn

  # Allow EventBridge to invoke the Lambda. Required for cross-service
  # invocation.
  EventBridgeInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref RealtimeFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ApiGatewayEventsRule.Arn

Outputs:
  FunctionArn:
    Description: Sync Lambda ARN
    Value: !GetAtt RealtimeFunction.Arn
  FunctionName:
    Description: Sync Lambda name (use for update-function-code)
    Value: !Ref RealtimeFunction
  ExecutionRoleName:
    Description: Lambda execution role name (paste into the GCP WIF aws_role attribute)
    Value: !Ref ExecutionRole
  ExecutionRoleArn:
    Description: Lambda execution role ARN
    Value: !GetAtt ExecutionRole.Arn
  EventBridgeRuleName:
    Description: EventBridge rule name (auto-generated)
    Value: !Ref ApiGatewayEventsRule
